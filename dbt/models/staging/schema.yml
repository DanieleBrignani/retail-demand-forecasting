version: 2
models:
  - name: stg_calendar
    columns:
      - name: date
        tests: [unique, not_null]
      - name: d
        tests: [unique, not_null]
      - name: day_num
        tests: [unique, not_null]
      - name: week_id
        tests: [not_null]
  - name: stg_series
    columns:
      - name: series_ord
        tests: [unique, not_null]
      - name: id
        tests: [unique, not_null]
      - name: item_id
        tests: [not_null]
      - name: store_id
        tests: [not_null]
      - name: state_id
        tests: [not_null]
      - name: cat_id
        tests: [not_null]
  - name: stg_sales_daily
    columns:
      - name: sales
        tests: [not_null]
      - name: series_ord
        tests:
          - not_null
          - relationships: {to: "ref('stg_series')", field: series_ord}
      - name: date
        tests:
          - not_null
          - relationships: {to: "ref('stg_calendar')", field: date}
  - name: stg_prices
    columns:
      - name: sell_price
        tests: [not_null]
      - name: week_id
        tests:
          - not_null
          - relationships: {to: "ref('stg_calendar')", field: week_id}
