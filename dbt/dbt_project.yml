name: retailfc
version: "0.1.0"
config-version: 2
profile: retailfc
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]
vars:
  # Required: the immutable raw dataset version to stage (see `retailfc warehouse load`).
  dataset_version: "__set_me__"
  # Allowed dimension values for this dataset (override with --vars if the adapter changes them)
  valid_states: [UK, INT]
  valid_categories: [RETAIL]
models:
  retailfc:
    staging:
      +schema: staging
      +materialized: table
