global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: retailfc-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: retailfc-exporter
    static_configs:
      - targets: ["exporter:9108"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
