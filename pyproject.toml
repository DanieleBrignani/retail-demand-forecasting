[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailfc"
version = "0.1.0"
description = "Retail demand forecasting platform: leakage-safe direct global forecasting, temporal backtesting, registry, serving, monitoring."
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "statsmodels>=0.14",
  "mlflow>=2.16",
  "prefect>=3.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "psycopg[binary,pool]>=3.2",
  "SQLAlchemy>=2.0",
  "prometheus-client>=0.20",
  "PyYAML>=6.0",
  "typer>=0.12",
  "matplotlib>=3.9",
  "joblib>=1.4",
  "tabulate>=0.9",
  "openpyxl>=3.1",
  "holidays>=0.50",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6", "nbformat", "nbconvert", "ipykernel"]
dbt = ["dbt-core>=1.8", "dbt-postgres>=1.8"]

[project.scripts]
retailfc = "retailfc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retailfc = ["warehouse/migrations/*.sql", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs a real PostgreSQL (RETAILFC_TEST_DSN)",
  "slow: slower end-to-end tests",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
